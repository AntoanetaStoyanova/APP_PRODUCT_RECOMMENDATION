name: RAG Evaluation

on:
  push:
    branches:
      - main  # Déclencher sur chaque push vers la branche principale (main), ajustez selon votre configuration

jobs:
  evaluate-rag:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10.6'

    - name: Install dependencies
      run: |
        pip install --upgrade -r requirements.txt  # Installe ou met à jour les dépendances

    - name: Set PYTHONPATH
      run: |
        export PYTHONPATH=$PWD  # Ajoute la racine du projet au PYTHONPATH
        echo "PYTHONPATH=$PYTHONPATH"  # Affiche PYTHONPATH pour vérifier

    - name: Run RAG evaluation script
      run: python ../app/rag_eval/eval_rag.py
