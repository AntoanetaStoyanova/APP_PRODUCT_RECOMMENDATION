<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats de la Recommandation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            text-align: center;
        }

        /* Conteneur principal */
        .product-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin: 20px auto;
            max-width: 90%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Conteneur pour les images en ligne */
        .product-list {
            display: flex;
            flex-wrap: nowrap; /* Assure que les produits restent en ligne */
            overflow-x: auto; /* Ajoute un défilement horizontal si nécessaire */
            justify-content: center;
            gap: 20px;
            width: 100%;
            padding: 10px;
        }

        /* Chaque carte produit */
        .product-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 200px; /* Largeur minimale pour éviter l'écrasement */
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            background-color: #f9f9f9;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Style des images */
        .product-card img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Messages "Aucune image disponible" */
        .no-image {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Colonne des descriptions */
        .description-column {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .product-description {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
        }

    </style>
</head>
<body>
    <h1>Résultats de la Recommandation</h1>
    
    <p><strong>Réponse brute :</strong></p>
    <pre>{{ recommendation }}</pre>

    <!-- Conteneur principal -->
    <div class="product-container">
        <!-- Colonne des images sous forme de cartes en ligne -->
        <div class="product-list">
            {% for img in img_produit %}
                <div class="product-card">
                    {% if img != "Aucune image disponible pour ce produit" %}
                        <img src="{{ img }}" alt="Image du produit recommandé">
                        
                    {% else %}
                        <p class="no-image">Aucune image disponible</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <!-- Colonne des descriptions -->
        <div class="description-column">
            {% for description in descriptions_produit %}
                <div class="product-description">
                    <p>{{ description }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
